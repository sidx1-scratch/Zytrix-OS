name: "Compile Branded Zytrix OS"

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xorriso \
          squashfs-tools \
          rsync \
          wget \
          curl \
          p7zip-full \
          grub-pc-bin \
          grub-efi-amd64-bin

    - name: Download Ubuntu ISO
      run: |
        wget -O base.iso https://releases.ubuntu.com/24.04/ubuntu-24.04-live-server-amd64.iso

    - name: Extract ISO Properly
      run: |
        mkdir -p mnt iso_source
        sudo mount -o loop base.iso mnt
        rsync -a mnt/ iso_source/
        sudo umount mnt

    - name: Inject Branding Assets
      run: |
        mkdir -p iso_source/nocloud
        mkdir -p iso_source/custom_branding

        cp user-data iso_source/nocloud/user-data 2>/dev/null || true
        touch iso_source/nocloud/meta-data

        # Safe GRUB patching
        if [ -f "iso_source/boot/grub/grub.cfg" ]; then
          sed -i 's/Ubuntu/Zytrix OS/g' iso_source/boot/grub/grub.cfg
        fi

        if [ -f "iso_source/EFI/BOOT/grub.cfg" ]; then
          sed -i 's/Ubuntu/Zytrix OS/g' iso_source/EFI/BOOT/grub.cfg
        fi

        # Logo
        if [ -f "logo.png" ]; then
          cp logo.png iso_source/custom_branding/logo.png
        fi

        # Branding script executed in installed system
        cat > iso_source/custom_branding/apply_branding.sh << 'EOF'
#!/bin/bash

set -e

mkdir -p /target/usr/share/pixmaps
mkdir -p /target/usr/share/plymouth/themes/zytrix
mkdir -p /target/etc/dconf/db/gdm.d
mkdir -p /target/boot/grub/themes/zytrix

# Copy logo if available
if [ -f /cdrom/custom_branding/logo.png ]; then
  cp /cdrom/custom_branding/logo.png /target/usr/share/pixmaps/custom_logo.png
fi

# GDM login logo
cat << 'GDM' > /target/etc/dconf/db/gdm.d/01-logo
[org/gnome/login-screen]
logo='/usr/share/pixmaps/custom_logo.png'
GDM

# Plymouth branding (safe copy)
if [ -f /target/usr/share/pixmaps/custom_logo.png ]; then
  cp /target/usr/share/pixmaps/custom_logo.png \
    /target/usr/share/plymouth/themes/zytrix/watermark.png
fi

# GRUB theme
cat << 'GRUB' > /target/boot/grub/themes/zytrix/theme.txt
title-text: "Zytrix OS Boot Manager"
title-color: "#FF6600"
desktop-color: "#0B0B0B"

+ boot_menu {
  left = 15%
  top = 20%
  width = 70%
  height = 60%
  item_color = "#AAAAAA"
  selected_item_color = "#FFFFFF"
  selected_item_bg_color = "#FF6600"
}

+ label {
  top = 85%
  left = 15%
  text = "Use arrow keys to navigate"
  color = "#777777"
}
GRUB

# GRUB config safe update
if grep -q "^GRUB_DISTRIBUTOR" /target/etc/default/grub; then
  sed -i 's/^GRUB_DISTRIBUTOR=.*/GRUB_DISTRIBUTOR="Zytrix OS"/' /target/etc/default/grub
else
  echo 'GRUB_DISTRIBUTOR="Zytrix OS"' >> /target/etc/default/grub
fi

echo 'GRUB_THEME="/boot/grub/themes/zytrix/theme.txt"' >> /target/etc/default/grub

chroot /target update-initramfs -u || true
chroot /target update-grub || true
chroot /target dconf update || true
EOF

        chmod +x iso_source/custom_branding/apply_branding.sh

    - name: Cloud-init Config (FIXED)
      run: |
        cat > iso_source/nocloud/user-data << 'EOF'
#cloud-config
autoinstall:
  version: 1
  identity:
    hostname: zytrix
    username: zytrix
    password: "$6$rounds=4096$saltsalt$saltsalthash"
  late-commands:
    - curtin in-target -- bash /cdrom/custom_branding/apply_branding.sh
EOF

    - name: Build ISO (UEFI + BIOS)
      run: |
        mkdir -p build

        xorriso -as mkisofs \
          -r -V "Zytrix_OS" \
          -o build/zytrix-os.iso \
          -J -joliet-long -l \
          -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
          -partition_offset 16 \
          -b boot/grub/i386-pc/eltorito.img \
          -c boot.catalog \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -eltorito-alt-boot \
          -e boot/grub/efi.img \
          -no-emul-boot \
          iso_source

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zytrix-OS
        path: build/zytrix-os.iso

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: build/zytrix-os.iso
        name: Zytrix OS ${{ github.ref_name }}
        body: |
          Zytrix OS automated build

          Includes:
          - Custom branding (GRUB, Plymouth, GDM)
          - Cloud-init autoinstall
          - Ubuntu 24.04 base
        draft: false
        prerelease: false

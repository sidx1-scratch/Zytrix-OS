name: Compile Branded Zytrix OS

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xorriso \
          squashfs-tools \
          rsync \
          curl \
          wget \
          p7zip-full \
          grub-pc-bin \
          grub-efi-amd64-bin

    - name: Download Base Ubuntu Image
      run: |
        wget -O base.iso https://releases.ubuntu.com/24.04/ubuntu-24.04-live-server-amd64.iso

    - name: Extract ISO Properly
      run: |
        mkdir -p mnt iso_source
        sudo mount -o loop base.iso mnt
        rsync -a mnt/ iso_source/
        sudo umount mnt

    - name: Inject NoCloud Config + Branding
      run: |
        mkdir -p iso_source/nocloud
        cp user-data iso_source/nocloud/user-data || true
        touch iso_source/nocloud/meta-data

        # Fix boot menu branding safely
        sed -i 's/Ubuntu/Zytrix OS/g' iso_source/boot/grub/grub.cfg || true

        # Branding assets
        mkdir -p iso_source/custom_branding

        if [ -f "logo.png" ]; then
          cp logo.png iso_source/custom_branding/logo.png
        else
          echo "WARNING: logo.png missing"
        fi

        # Apply branding script (target system side)
        cat << 'EOF' > iso_source/custom_branding/apply_branding.sh
#!/bin/bash

mkdir -p /target/usr/share/pixmaps
mkdir -p /target/usr/share/plymouth/themes/zytrix
mkdir -p /target/etc/dconf/db/gdm.d
mkdir -p /target/boot/grub/themes/zytrix

cp /cdrom/custom_branding/logo.png /target/usr/share/pixmaps/custom_logo.png

cat << 'GDM' > /target/etc/dconf/db/gdm.d/01-logo
[org/gnome/login-screen]
logo='/usr/share/pixmaps/custom_logo.png'
GDM

cp /cdrom/custom_branding/logo.png /target/usr/share/plymouth/themes/zytrix/watermark.png

cat << 'GRUB' > /target/boot/grub/themes/zytrix/theme.txt
title-text: "Zytrix OS Boot Manager"
title-color: "#FF6600"
desktop-color: "#0B0B0B"

+ boot_menu {
  left = 15%
  top = 20%
  width = 70%
  height = 60%
  item_color = "#AAAAAA"
  selected_item_color = "#FFFFFF"
  selected_item_bg_color = "#FF6600"
}

+ label {
  top = 85%
  left = 15%
  text = "Use arrows to navigate"
  color = "#777777"
}
GRUB

echo 'GRUB_THEME="/boot/grub/themes/zytrix/theme.txt"' >> /target/etc/default/grub
sed -i 's/^GRUB_DISTRIBUTOR=.*/GRUB_DISTRIBUTOR="Zytrix OS"/' /target/etc/default/grub || true

chroot /target update-initramfs -u || true
chroot /target update-grub || true
chroot /target dconf update || true
EOF

        chmod +x iso_source/custom_branding/apply_branding.sh

    - name: Fix Cloud-init Autoinstall Hook
      run: |
        cat << 'EOF' >> iso_source/nocloud/user-data

late-commands:
  - curtin in-target -- bash /cdrom/custom_branding/apply_branding.sh
EOF

    - name: Build ISO (UEFI + BIOS)
      run: |
        mkdir -p build

        xorriso -as mkisofs \
          -r -V "Zytrix_OS" \
          -o build/zytrix-os.iso \
          -J -joliet-long -l \
          -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
          -partition_offset 16 \
          -b boot/grub/i386-pc/eltorito.img \
          -c boot.catalog \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -eltorito-alt-boot \
          -e boot/grub/efi.img \
          -no-emul-boot \
          iso_source

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zytrix-OS
        path: build/zytrix-os.iso

    - name: Release ISO
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: build/zytrix-os.iso
        name: Zytrix OS ${{ github.ref_name }}
        body: |
          Automated Zytrix OS build

          Includes:
          - Custom branding
          - NoCloud autoinstall
          - GRUB + Plymouth customization
          - GNOME login screen logo
        draft: false
        prerelease: false

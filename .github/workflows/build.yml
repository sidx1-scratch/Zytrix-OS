name: Compile Branded Zytrix OS

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Triggers an official release when you push a version tag (e.g., v1.0.0)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions web UI

permissions:
  contents: write # Grants permissions to create GitHub Releases and upload the ISO

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso sed curl wget p7zip-full

    - name: Download Base Ubuntu Image
      run: |
        wget -O base.iso https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso

    - name: Remaster and Inject Visual Identity
      run: |
        mkdir -p iso_source
        7z x base.iso -oiso_source

        # 1. Structure the automated installer directories
        mkdir -p iso_source/nocloud
        cp user-data iso_source/nocloud/user-data
        touch iso_source/nocloud/meta-data

        # Modify default ISO bootloader menu labels to read Zytrix OS
        sed -i 's/Ubuntu/Zytrix OS/g' iso_source/boot/grub/grub.cfg
        sed -i 's|---|"ds=nocloud;s=/cdrom/nocloud/" ---|g' iso_source/boot/grub/grub.cfg

        # 2. Stage visual asset directory inside ISO
        mkdir -p iso_source/custom_branding
        if [ -f "logo.png" ]; then
          cp logo.png iso_source/custom_branding/logo.png
        else
          echo "WARNING: logo.png not found in repository root. Creating fallback."
          touch iso_source/custom_branding/logo.png
        fi

        # 3. Create the script that applies your branding on target machine install
        cat << 'EOF' > iso_source/custom_branding/apply_branding.sh
        #!/bin/bash
        # Target machine workspace deployment script

        # Ensure target system image path exists
        mkdir -p /target/usr/share/pixmaps
        mkdir -p /target/usr/share/plymouth/themes/spinner
        mkdir -p /target/etc/dconf/db/gdm.d
        mkdir -p /target/boot/grub/themes/zytrix

        # Copy user custom branding logo to system directories
        cp /cdrom/custom_branding/logo.png /target/usr/share/pixmaps/custom_logo.png

        # Inject GDM Login Display Screen Logo Configuration
        cat << 'GDM' > /target/etc/dconf/db/gdm.d/01-logo
        [org/gnome/login-screen]
        logo='/usr/share/pixmaps/custom_logo.png'
        GDM

        # Update Plymouth Boot Theme Logo (Override system default watermark)
        cp /cdrom/custom_branding/logo.png /target/usr/share/plymouth/themes/spinner/watermark.png

        # ---- ORANGE GRUB BOOT MENU STYLE GENERATION ----
        # Dynamically script an integrated theme mapping orange UI accents
        cat << 'GRUBTHEME' > /target/boot/grub/themes/zytrix/theme.txt
        title-text: "Zytrix OS Boot Manager"
        title-color: "#FF6600"
        desktop-color: "#0B0B0B"
        terminal-box: "theme/terminal_box_*.png"
        + boot_menu {
          left = 15%
          top = 20%
          width = 70%
          height = 60%
          item_font = "Ubuntu Regular 12"
          item_color = "#AAAAAA"
          selected_item_color = "#FFFFFF"
          selected_item_bg_color = "#FF6600"
        }
        + label {
          top = 85%
          left = 15%
          text = "Use Arrow Keys to navigate options. Press Enter to boot."
          color = "#777777"
        }
        GRUBTHEME

        # Bind custom style directly to global environment default profiles
        echo "GRUB_THEME=\"/boot/grub/themes/zytrix/theme.txt\"" >> /target/etc/default/grub
        echo "GRUB_DISTRIBUTOR=\"Zytrix OS\"" >> /target/etc/default/grub

        # Ensure system initramfs and boot records register all visual configuration updates
        chroot /target update-initramfs -u
        chroot /target update-grub
        chroot /target dconf update
        EOF

        # Append late-commands step to user-data to trigger visual installation
        chmod +x iso_source/custom_branding/apply_branding.sh
        echo "    - bash /cdrom/custom_branding/apply_branding.sh" >> iso_source/nocloud/user-data

    - name: Compile Final ISO File
      run: |
        mkdir -p build
        xorriso -as mkisofs -r \
          -V "Zytrix_OS" \
          -o build/zytrix-os.iso \
          -J -joliet-long -l \
          -b boot/grub/i386-pc/eltorito.img \
          -c boot.catalog \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -eltorito-alt-boot \
          -e boot/grub/efi.img \
          -no-emul-boot \
          iso_source

    - name: Upload Bootable Image as Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zytrix-OS-Installer
        path: build/zytrix-os.iso

    - name: Publish Production Zytrix OS Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: build/zytrix-os.iso
        name: Zytrix OS Release ${{ github.ref_name }}
        body: |
          Automated compilation build for Zytrix OS.

          ### Preinstalled Desktop App Environment:
          * VS Code & Neovim Editors
          * GDM Settings Manager & NeoChat Client
          * EasyEDA Suite & Arduino IDE
          * Raspberry Pi Imager
        draft: false
        prerelease: false
